version: '3.8'

services:
  db:
    image: postgres:13-alpine
    container_name: hospital-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: hospital_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital-net

  backend:
    build: ./backend
    container_name: hospital-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/hospital_db
    depends_on:
      - db
    networks:
      - hospital-net

  frontend:
    build: ./frontend
    container_name: hospital-frontend
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - hospital-net

volumes:
  postgres_data:

networks:
  hospital-net:
    driver: bridge
