<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7 | Secured Volumes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #112233, #192a56, #273c75);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        h1 {
            margin-top: 0;
            font-size: 30px;
            color: #00d2ff;
        }
        p {
            font-size: 17px;
            line-height: 1.6;
            color: #dcdcdc;
        }
        .badges {
            margin-top: 25px;
        }
        .badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 5px;
        }
        .badge.success {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 Day 7: Secured Volumes</h1>
        <p>Welcome to the production-grade Web Server!</p>
        <p>This data is stored persistently in a decoupled <strong>Docker Volume</strong> and mounted into the container as a strict <strong>Read-Only</strong> file system.</p>
        <div class="badges">
            <span class="badge">Read-Only Mount</span>
            <span class="badge success">Enterprise Ready 🚀</span>
        </div>
    </div>
</body>
</html>
